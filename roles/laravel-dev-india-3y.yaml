# One file per role. Add a new file to source a different role; no code changes needed.
name: laravel-dev-india-3y

# Languages GitHub reports for the candidate's repos (exact GitHub names).
languages: [PHP]

# Matched (case-insensitive) against repo name, description and topics.
keywords: [laravel, livewire, eloquent, inertia, filament]

# Matched (case-insensitive substring) against the free-text profile location.
# A candidate must match at least one to be kept.
locations: [India, Bengaluru, Bangalore, Hyderabad, Pune, Chennai, Mumbai, Delhi, Noida, Gurgaon, Gurugram, Kolkata, Ahmedabad, Kochi, Jaipur]

# Listed first (never required). People here appear above everyone else, best score first.
preferred_locations: [Bengaluru, Bangalore]

# City names repeat across countries; reject profiles that name any of these places.
exclude_locations: [Pakistan, Bangladesh, Sri Lanka, Nepal, Kenya, Nigeria, USA, United States, UK, United Kingdom, Canada, Australia, Germany, Dubai, UAE, Singapore]

# Rough estimate from the date of the first relevant public repo. GitHub has no
# "years of experience" field, so treat this as a hint only.
experience: {min_years: 2.5, max_years: 5}

signals:
  min_public_repos: 3
  active_within_months: 12

# Primary-skill gate: drop people for whom the language/framework isn't a main skill.
primary_skill:
  min_language_share: 0.3     # PHP must be >= 30% of their own non-fork repos
  min_keyword_repos: 1        # at least one repo showing Laravel
  manifest:                   # fallback evidence when names/descriptions don't say "laravel"
    file: composer.json
    contains: [laravel/framework]

# Email template (from HR). Placeholders: {first_name}, {repo}, {sender}, {role_title}.
outreach:
  role_title: PHP Laravel Developer
  subject: "PHP Laravel Developer opportunity at Zibtek (Bangalore, Work from Office)"
  body: |
    Hi {first_name},

    Hope you are doing well!!

    Zibtek is a leading custom software development company offering secure software development, IT staff augmentation, and more. https://www.zibtek.com/

    Your profile caught our attention while seeking skilled Laravel professionals.

    We are currently hiring a PHP Laravel Developer for a full-time, Work from Office role in Bangalore.

    Why explore this?
    Impact: You will have direct ownership of scalable web applications and architectural decisions.
    Collaboration: Work alongside a highly driven, in-person engineering team to brainstorm and ship code faster.

    If you are interested in exploring this role, please reply to this email with your updated resume.

    Career page: https://www.zibtek.com/careers

# Optional tuning of the rule-based score (all default to the values shown).
# weights: {keywords: 40, language: 10, experience: 25, activity: 15, contact: 10}
