[project]
name = "crewdesk-api"
version = "0.1.0"
description = "Role-driven developer sourcing from public GitHub data, with manual outreach tracking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pymongo>=4.11",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sourcer = "sourcer.cli:main"
sourcer-admin = "sourcer.admin:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sourcer", "sourcer.tenancy", "sourcer.api", "sourcer.api.routes", "sourcer.people"]
include-package-data = true

[tool.setuptools.package-data]
sourcer = ["static/*"]
